[project]
name = "investmenteda"
version = "0.1.0"
description = "Local commodity and supply-chain control room (v0)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[tool.pytest.ini_options]
# Run pytest from the repo root and let tests import `ingest` and `db` as
# ordinary packages, without installing anything.
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
# The code in this repo is written to be read by someone learning, which means
# longer names and fuller comments than a terse style would use. 95 columns
# keeps that readable without letting lines run off the side of a laptop screen.
line-length = 95

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (real errors), I import order, UP modern syntax,
# B common bugs. Deliberately not the whole catalogue: a linter that shouts
# about style gets switched off, and then it is not catching the real ones.
select = ["E", "W", "F", "I", "UP", "B"]
